<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideNova shared trip</title><script src="/admin/assets/map44.js"></script><style>body{background:#101722;color:#f5f6ff;font:16px system-ui;margin:24px auto;max-width:760px;padding:20px}#map{height:55vh;min-height:300px;border-radius:18px}button{padding:12px}p{line-height:1.6}</style></head><body><h1>RideNova · Shared trip</h1><p id="status" role="status">Loading…</p><div id="map" aria-label="Driver and destination map"></div><p id="detail"></p><button id="refresh">Refresh</button><p>Last reported driver location, not emergency monitoring. In immediate danger contact emergency services.</p><script>
(()=>{'use strict';const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let map,layer,busy=false;async function load(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/v3/operations/public-share',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.message||'Link unavailable');document.getElementById('status').textContent=d.status.replaceAll('_',' ');const p=d.driverPosition,dest=d.destination;document.getElementById('detail').textContent=(dest.address||dest.name)+' · '+(p?Math.max(0,Math.floor((d.serverTimeEpochMs-p.observedAtEpochMs)/1000))+'s since driver update · ±'+Math.round(p.accuracyMeters)+'m':'GPS not yet available');if(!map){await loadRideNovaMap();map=RNMap.map('map').setView([dest.latitude,dest.longitude],12);layer=RNMap.layerGroup().addTo(map)}layer.clearLayers();const bounds=[[dest.latitude,dest.longitude]];RNMap.circleMarker(bounds[0],{color:'#8673ff'}).bindTooltip('Destination').addTo(layer);if(p){bounds.push([p.latitude,p.longitude]);RNMap.circleMarker(bounds[1],{color:'#259764'}).bindTooltip('Driver · last reported').addTo(layer)}map.fitBounds(bounds,{padding:[40,40],maxZoom:15})}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('detail').textContent='Tracking unavailable';layer?.clearLayers()}finally{busy=false}}document.getElementById('refresh').onclick=load;load();setInterval(load,15000)})();
</script></body></html>
