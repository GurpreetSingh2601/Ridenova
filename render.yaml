# REVIEW ONLY: creating this Blueprint incurs charges. Owner approval required.
# Set secrets in Render, never commit them. Initial deployment needs bootstrap.
services:
  - type: web
    name: ridenova-staging-api
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    rootDir: Passenger/backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python migrate.py
    startCommand: gunicorn -c gunicorn.conf.py 'wsgi:create_app()'
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: RIDENOVA_ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: ridenova-staging-db
          property: connectionString
      - key: RIDENOVA_PUBLIC_ORIGIN
        sync: false
      - key: RIDENOVA_STAGING_TESTERS
        sync: false
      - key: RIDENOVA_STAGING_DRIVER_PHONES
        sync: false
      - key: RIDENOVA_RATE_SECRET
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: '*'
  - type: worker
    name: ridenova-staging-scheduler
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    rootDir: Passenger/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: RIDENOVA_ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: ridenova-staging-db
          property: connectionString
      - key: RIDENOVA_PUBLIC_ORIGIN
        fromService:
          type: web
          name: ridenova-staging-api
          envVarKey: RIDENOVA_PUBLIC_ORIGIN
      - key: RIDENOVA_STAGING_TESTERS
        fromService:
          type: web
          name: ridenova-staging-api
          envVarKey: RIDENOVA_STAGING_TESTERS
      - key: RIDENOVA_STAGING_DRIVER_PHONES
        fromService:
          type: web
          name: ridenova-staging-api
          envVarKey: RIDENOVA_STAGING_DRIVER_PHONES
      - key: RIDENOVA_RATE_SECRET
        fromService:
          type: web
          name: ridenova-staging-api
          envVarKey: RIDENOVA_RATE_SECRET
databases:
  - name: ridenova-staging-db
    databaseName: ridenova_staging
    user: ridenova
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    diskSizeGB: 1
    ipAllowList: []
